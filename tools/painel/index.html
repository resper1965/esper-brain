<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Temas</title>
<link rel="icon" href="data:,">
<style>
/* tokens: mundo "laudo" da Gabi (fonte: gabi-finance/painel/src/tema/tokens.css). Única fonte de cor. */
:root{
  --papel:oklch(0.962 0.008 170);--folha:oklch(0.985 0.004 170);--papel-2:oklch(0.935 0.011 170);--papel-3:oklch(0.905 0.013 170);
  --tinta:oklch(0.27 0.032 255);--tinta-2:oklch(0.44 0.026 250);--tinta-3:oklch(0.51 0.02 245);
  --regra:oklch(0.87 0.012 190);--regra-forte:oklch(0.7 0.016 220);
  --acento:oklch(0.45 0.115 255);--acento-hover:oklch(0.39 0.11 255);--sobre-acento:oklch(0.985 0.004 170);--acento-fundo:oklch(0.92 0.03 250);
  --foco:oklch(0.52 0.15 255);--selecao:oklch(0.85 0.06 250);
  --trilho:oklch(0.235 0.014 240);--trilho-2:oklch(0.29 0.016 240);--trilho-regra:oklch(0.35 0.016 240);--trilho-tinta:oklch(0.9 0.01 200);--trilho-tinta-2:oklch(0.74 0.014 220);
  --carimbo-vermelho:oklch(0.5 0.17 25);--carimbo-vermelho-fundo:oklch(0.95 0.025 25);--carimbo-verde:oklch(0.46 0.1 155);
  --carimbo-azul:oklch(0.46 0.13 255);--carimbo-grafite:oklch(0.42 0.025 250);
  --ambar-borda:oklch(0.6 0.12 75);--ambar-tinta:oklch(0.33 0.07 65);--ambar-fundo:oklch(0.955 0.045 92);
  --emp-ness:oklch(0.58 0.12 230);--emp-ionic:oklch(0.53 0.13 305);--emp-bekaa:oklch(0.66 0.13 65);
  --sombra-camada:0 6px 20px -6px oklch(0.25 0.03 250 / 0.28),0 1px 3px oklch(0.25 0.03 250 / 0.12);
  --veu:oklch(0.235 0.014 240 / 0.55);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --papel:oklch(0.205 0.01 225);--folha:oklch(0.235 0.011 225);--papel-2:oklch(0.27 0.012 225);--papel-3:oklch(0.31 0.013 225);
  --tinta:oklch(0.925 0.01 200);--tinta-2:oklch(0.77 0.015 210);--tinta-3:oklch(0.7 0.016 215);
  --regra:oklch(0.33 0.012 225);--regra-forte:oklch(0.46 0.014 225);
  --acento:oklch(0.77 0.1 248);--acento-hover:oklch(0.84 0.08 248);--sobre-acento:oklch(0.2 0.03 250);--acento-fundo:oklch(0.31 0.045 250);
  --foco:oklch(0.78 0.12 248);--selecao:oklch(0.4 0.08 250);
  --trilho:oklch(0.155 0.01 235);--trilho-2:oklch(0.215 0.012 235);--trilho-regra:oklch(0.28 0.012 235);--trilho-tinta:oklch(0.9 0.01 200);--trilho-tinta-2:oklch(0.72 0.014 220);
  --carimbo-vermelho:oklch(0.74 0.14 25);--carimbo-vermelho-fundo:oklch(0.29 0.06 25);--carimbo-verde:oklch(0.78 0.12 155);
  --carimbo-azul:oklch(0.77 0.1 250);--carimbo-grafite:oklch(0.78 0.015 215);
  --ambar-borda:oklch(0.72 0.12 80);--ambar-tinta:oklch(0.92 0.06 85);--ambar-fundo:oklch(0.3 0.05 80);
  --emp-ness:oklch(0.72 0.11 230);--emp-ionic:oklch(0.72 0.12 305);--emp-bekaa:oklch(0.79 0.12 70);
  --sombra-camada:0 8px 24px -6px oklch(0 0 0 / 0.55),0 1px 3px oklch(0 0 0 / 0.4);
  --veu:oklch(0.1 0.01 235 / 0.7);
  color-scheme:dark;
}}
:root{
  --sans:"Public Sans Variable","Public Sans",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --t-2:0.6875rem;--t-1:0.75rem;--t0:0.875rem;--t1:1rem;--t2:1.125rem;--t3:1.3125rem;--t4:1.5rem;
  --e1:4px;--e2:8px;--e3:12px;--e4:16px;--e5:24px;--e6:32px;
  --raio:2px;--dur:180ms;--dur-curta:150ms;--curva:cubic-bezier(0.16,1,0.3,1);
  --alvo:34px;
}

/* base */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--sans);font-size:var(--t0);font-weight:400;line-height:1.5;font-optical-sizing:auto;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;caret-color:var(--acento)}
h1,h2,h3,h4,h5,h6{color:var(--tinta);text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
::selection{background:var(--selecao);color:var(--tinta)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
::placeholder{color:var(--tinta-3);opacity:1}
*{scrollbar-width:thin;scrollbar-color:var(--regra-forte) transparent}

/* faixa da marca (trilho) */
.faixa-marca{flex:none;display:flex;align-items:center;padding:10px var(--e5);background:var(--trilho);color:var(--trilho-tinta);border-bottom:1px solid var(--trilho-regra)}
.marca-nome{font-size:var(--t1);line-height:1.1}
.marca-nome strong{font-weight:700;letter-spacing:-0.01em;color:var(--trilho-tinta)}
.marca-nome strong span{font-weight:400;color:var(--trilho-tinta-2)}

/* topo: pergunta da tela + controles */
.topo{flex:none;display:flex;align-items:center;gap:var(--e2) var(--e3);flex-wrap:wrap;padding:var(--e4) var(--e5);background:var(--papel);border-bottom:1px solid var(--regra-forte)}
.topo-pergunta{margin:0 var(--e3) 0 0;font-size:var(--t4);font-weight:650;line-height:1.2;letter-spacing:-0.015em}
.busca{flex:1 1 220px;max-width:340px;position:relative}
.busca input{width:100%;min-height:var(--alvo);border:1px solid var(--regra-forte);border-radius:var(--raio);background:var(--folha);color:var(--tinta);padding:0 10px 0 32px;transition:border-color var(--dur-curta) var(--curva),box-shadow var(--dur-curta) var(--curva)}
.busca input:hover{border-color:var(--tinta-3)}
.busca input:focus-visible{outline:none;border-color:var(--foco);box-shadow:0 0 0 2px color-mix(in oklch,var(--foco) 35%,transparent)}
.busca::before{content:"";position:absolute;left:11px;top:50%;margin-top:-7px;width:9px;height:9px;border:1.5px solid var(--tinta-3);border-radius:50%;pointer-events:none}
.busca::after{content:"";position:absolute;left:20px;top:50%;margin-top:3px;width:5px;height:1.5px;background:var(--tinta-3);transform:rotate(45deg);pointer-events:none}
.botao-topo{display:inline-flex;align-items:center;justify-content:center;min-height:var(--alvo);padding:0 12px;border:1px solid var(--regra-forte);border-radius:var(--raio);background:var(--folha);color:var(--tinta);font-weight:600;white-space:nowrap;transition:background-color var(--dur-curta) var(--curva),border-color var(--dur-curta) var(--curva),color var(--dur-curta) var(--curva)}
.botao-topo:hover{background:var(--papel-2);border-color:var(--tinta-3)}
.botao-topo:active{background:var(--papel-3)}
.botao-topo[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}
.contador{display:inline-flex;align-items:center;min-height:var(--alvo);padding:0 10px;border:1px solid var(--regra);border-radius:var(--raio);color:var(--tinta-2);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.contador.tem{background:var(--ambar-fundo);border-color:var(--ambar-borda);color:var(--ambar-tinta)}
.espaco{flex:1}

/* quadro */
.quadro{flex:1;min-height:0;display:flex;align-items:flex-start;gap:var(--e4);padding:var(--e5) var(--e5) var(--e5);overflow-x:auto;overflow-y:hidden;background:var(--papel)}
.lista{flex:0 0 288px;width:288px;max-height:100%;display:flex;flex-direction:column;background:var(--folha);border:1px solid var(--regra);border-radius:var(--raio)}
.lista[data-coluna="ness"]{border-top:3px solid var(--emp-ness)}
.lista[data-coluna="ionic"]{border-top:3px solid var(--emp-ionic)}
.lista[data-coluna="bekaa"]{border-top:3px solid var(--emp-bekaa)}
.lista.alvo{outline:2px solid var(--foco);outline-offset:2px}
.cab{display:flex;align-items:baseline;gap:var(--e2);margin:0 var(--e4);padding:var(--e3) 0 var(--e2);border-bottom:1px solid var(--regra)}
.cab h2{margin:0;font-size:var(--t2);font-weight:650;line-height:1.25;letter-spacing:-0.005em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conta{color:var(--tinta-3);font-size:var(--t0);font-weight:500;font-variant-numeric:tabular-nums}
.cartoes{flex:1 1 auto;min-height:8px;overflow-y:auto;padding:var(--e3) var(--e3) var(--e1);display:flex;flex-direction:column;gap:var(--e2)}
.vazio{margin:var(--e1) var(--e1) var(--e2);color:var(--tinta-3)}
.cartoes:has(.placeholder) .vazio{display:none}
.cartao{position:relative;background:var(--folha);border:1px solid var(--regra-forte);border-radius:var(--raio);padding:var(--e3);cursor:pointer;user-select:none;transition:box-shadow var(--dur-curta) var(--curva),border-color var(--dur-curta) var(--curva),opacity var(--dur) var(--curva)}
.cartao:hover{border-color:var(--tinta-3);box-shadow:var(--sombra-camada)}
.cartao:focus-visible{outline-offset:1px}
.cartao:active{cursor:grabbing}
.cartao.arrastando{display:none}
.cartao.enviando{opacity:.45;pointer-events:none}
.cartao.concluido .titulo{color:var(--tinta-3);text-decoration:line-through;text-decoration-thickness:1px}
.titulo{margin:0;font-size:var(--t1);font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.passo{margin:var(--e1) 0 0;color:var(--tinta-2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}

/* carimbos */
.etiquetas{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:var(--e2)}
.etq{--c:var(--carimbo-grafite);display:inline-flex;align-items:center;max-width:100%;padding:1px 6px 0;border:3px double var(--c);border-radius:1px;color:var(--c);font:700 var(--t-2)/1.45 var(--sans);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etq.estado-parado{--c:var(--carimbo-grafite)}
.etq.estado-concluido{--c:var(--carimbo-verde)}
.etq.marca,.etq.frente{--c:var(--carimbo-azul)}
.etq.holding{--c:var(--carimbo-grafite)}
.etq.cliente{order:9;flex-basis:100%;padding:0;border:0;color:var(--tinta-2);font:500 var(--t-1)/1.4 var(--sans);letter-spacing:0;text-transform:none}
.rodape{display:flex;flex-wrap:wrap;align-items:center;gap:var(--e1) var(--e3);margin-top:var(--e2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-1);color:var(--tinta-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.prazo::before{content:"";flex:none;width:9px;height:9px;border:1.5px solid currentColor;border-radius:50%;background:linear-gradient(currentColor,currentColor) 50% 1px/1.5px 4px no-repeat}
.chip.prazo.vencido{padding:1px 6px 0;border:3px double var(--carimbo-vermelho);border-radius:1px;color:var(--carimbo-vermelho);font-size:var(--t-2);font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.chip.prazo.perto{padding:1px 6px;border:1px solid var(--ambar-borda);border-radius:var(--raio);background:var(--ambar-fundo);color:var(--ambar-tinta);font-weight:600}
.chip.prazo.invalido{padding:0 5px;border:1px solid var(--regra-forte);border-radius:var(--raio)}
.chip.parado-ha{color:var(--tinta-3)}
.placeholder{flex:0 0 auto;border:1px dashed var(--regra-forte);border-radius:var(--raio);background:var(--papel-2);min-height:36px}

/* pé da coluna, composer, botões */
.pe{padding:var(--e1) var(--e3) var(--e3)}
.add{width:100%;min-height:var(--alvo);text-align:left;border:1px solid transparent;border-radius:var(--raio);background:transparent;color:var(--tinta-2);padding:0 var(--e2);font-weight:500;transition:background-color var(--dur-curta) var(--curva),color var(--dur-curta) var(--curva)}
.add:hover{background:var(--papel-2);color:var(--tinta)}
.composer{display:flex;flex-direction:column;gap:var(--e2)}
.composer textarea{resize:none;border:1px solid var(--regra-forte);border-radius:var(--raio);padding:8px 10px;background:var(--folha);min-height:64px;line-height:1.4}
.composer textarea:focus-visible,.campo input:focus-visible,.campo select:focus-visible,.campo textarea:focus-visible{outline:none;border-color:var(--foco);box-shadow:0 0 0 2px color-mix(in oklch,var(--foco) 35%,transparent)}
.linha{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.primario,.fantasma{display:inline-flex;align-items:center;justify-content:center;min-height:var(--alvo);padding:0 12px;border:1px solid transparent;border-radius:var(--raio);font-weight:600;white-space:nowrap;transition:background-color var(--dur-curta) var(--curva),border-color var(--dur-curta) var(--curva),color var(--dur-curta) var(--curva)}
.primario{background:var(--acento);border-color:var(--acento);color:var(--sobre-acento)}
.primario:hover{background:var(--acento-hover);border-color:var(--acento-hover)}
.primario:disabled{background:var(--acento);border-color:var(--acento)}
.fantasma{background:transparent;color:var(--acento);padding:0 var(--e2)}
.fantasma:hover{background:var(--acento-fundo)}
.carregando{color:var(--tinta-2);padding:var(--e4);margin:0}

/* campos */
.campo{display:flex;flex-direction:column;gap:var(--e1);font-size:var(--t-1);font-weight:600;color:var(--tinta-2)}
.campo input,.campo select,.campo textarea{font-size:var(--t0);font-weight:400;color:var(--tinta);background:var(--folha);border:1px solid var(--regra-forte);border-radius:var(--raio);padding:0 10px;min-height:var(--alvo);width:100%;transition:border-color var(--dur-curta) var(--curva),box-shadow var(--dur-curta) var(--curva)}
.campo input:hover,.campo select:hover{border-color:var(--tinta-3)}
.aviso{font-size:var(--t-1);font-weight:600;color:var(--carimbo-vermelho)}

/* modal */
dialog{border:1px solid var(--regra-forte);padding:0;color:var(--tinta);background:var(--papel);border-radius:var(--raio);box-shadow:var(--sombra-camada)}
dialog::backdrop{background:var(--veu)}
#dlg-cartao{width:min(800px,calc(100vw - 32px));max-height:calc(100vh - 64px);overflow:auto}
dialog[open]{animation:entra var(--dur) var(--curva)}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m-cab{position:sticky;top:0;z-index:1;display:flex;align-items:flex-start;gap:var(--e3);padding:var(--e4) var(--e4) var(--e3) var(--e5);background:var(--papel);border-bottom:1px solid var(--regra-forte)}
.m-cab h2{margin:0;font-size:var(--t3);line-height:1.25;font-weight:650;letter-spacing:-0.01em;overflow-wrap:anywhere}
.m-sub{margin:var(--e1) 0 0;font-size:var(--t-1);color:var(--tinta-3);overflow-wrap:anywhere}
.m-sub b{color:var(--tinta-2);font-weight:600}
.m-cab .etiquetas{margin:var(--e2) 0 0}
.m-corpo{display:grid;grid-template-columns:minmax(0,1fr) 248px;gap:var(--e5);padding:var(--e4) var(--e5) var(--e5)}
.m-corpo h3.sec{margin:0 0 var(--e2);padding-bottom:6px;font-size:var(--t0);font-weight:650;border-bottom:1px solid var(--tinta)}
.md{background:var(--folha);border:1px solid var(--regra);border-radius:var(--raio);padding:var(--e1) var(--e4) var(--e3);overflow-wrap:anywhere;line-height:1.55}
.md h3{font-size:var(--t1);font-weight:650;margin:var(--e4) 0 6px}.md h4{font-size:var(--t0);font-weight:650;margin:14px 0 var(--e1);color:var(--tinta-2)}.md h5,.md h6{font-size:var(--t0);margin:var(--e3) 0 var(--e1)}
.md p{margin:6px 0}.md ul{margin:var(--e1) 0;padding-left:20px}.md li{margin:2px 0}
.md code{font-family:var(--mono);font-size:.92em;background:var(--papel-2);border-radius:1px;padding:0 3px}
.md pre{background:var(--papel-2);border:1px solid var(--regra);border-radius:var(--raio);padding:var(--e2);overflow:auto}.md pre code{background:none;padding:0}
.md .nada{color:var(--tinta-3)}
.lateral{display:flex;flex-direction:column;gap:var(--e5)}
.lateral form{display:flex;flex-direction:column;gap:var(--e2)}
.lateral .primario{align-self:flex-start}
.fechar{margin-left:auto;flex:0 0 auto}
#dlg-frente{width:min(360px,calc(100vw - 32px))}
#dlg-frente form{display:flex;flex-direction:column;gap:var(--e3);padding:var(--e5)}
#dlg-frente h2{margin:0;font-size:var(--t2);font-weight:650}
#dlg-frente p{margin:0;color:var(--tinta-2)}
#dlg-frente .linha{justify-content:flex-end}

/* toasts: ficha escura do trilho */
#toasts{position:fixed;left:50%;bottom:var(--e5);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:var(--e2);z-index:10;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
.toast{background:var(--trilho);color:var(--trilho-tinta);border:1px solid var(--trilho-regra);padding:10px var(--e4);border-radius:var(--raio);box-shadow:var(--sombra-camada);animation:sobe var(--dur) var(--curva);transition:opacity var(--dur) var(--curva),transform var(--dur) var(--curva);pointer-events:auto}
.toast.erro{background:var(--carimbo-vermelho);border-color:var(--carimbo-vermelho);color:var(--sobre-acento);font-weight:600}
.toast.saindo{opacity:0;transform:translateY(6px)}
@keyframes sobe{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes some{from{opacity:0}to{opacity:1}}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* celular */
@media (max-width:640px){
  :root{--alvo:44px}
  .faixa-marca{padding:var(--e2) var(--e4)}
  .topo{padding:var(--e3) var(--e4);gap:var(--e2)}
  .topo-pergunta{font-size:var(--t3);flex:1 1 auto;margin:0}
  .contador{order:1}
  .busca{order:2;flex-basis:100%;max-width:none}
  #concluidos{order:3;flex:1 1 auto}
  #recarregar{order:4;flex:1 1 auto}
  .espaco{display:none}
  .quadro{scroll-snap-type:x mandatory;padding:var(--e3);gap:var(--e3);scroll-padding:var(--e3)}
  .lista{flex-basis:86vw;width:86vw;scroll-snap-align:start}
  #dlg-cartao{width:100vw;max-width:100vw;height:100%;max-height:100%;margin:0;border:0;border-radius:0}
  .m-cab{padding:var(--e3) var(--e3) 10px var(--e4)}
  .m-corpo{grid-template-columns:1fr;padding:var(--e3) var(--e4) var(--e5)}
  .lateral{order:-1}
}
/* movimento reduzido: some o deslocamento, fica a mudança de opacidade e de cor */
@media (prefers-reduced-motion:reduce){
  dialog[open],.toast{animation-name:some}
  .toast.saindo{transform:none}
  .toast{transition-property:opacity}
}
</style>
</head>
<body>
<div class="faixa-marca"><span class="marca-nome"><strong>gabi<span>.temas</span></strong></span></div>
<header class="topo">
  <h1 class="topo-pergunta">Seus temas</h1>
  <div class="busca"><label class="so-leitor" for="busca">Buscar temas</label><input id="busca" type="search" placeholder="Buscar…" autocomplete="off"></div>
  <button id="concluidos" class="botao-topo" type="button" aria-pressed="false">Mostrar concluídos</button>
  <span class="espaco"></span>
  <span id="entrada" class="contador" title="Itens esperando na entrada.md">Entrada: …</span>
  <button id="recarregar" class="botao-topo" type="button">Recarregar</button>
</header>
<main id="quadro" class="quadro" aria-label="Quadro de temas"><p class="carregando">Carregando…</p></main>
<dialog id="dlg-cartao" aria-labelledby="m-titulo"></dialog>
<dialog id="dlg-frente" aria-labelledby="f-titulo">
  <form method="dialog">
    <h2 id="f-titulo">Frente da IONIC</h2>
    <p id="f-texto"></p>
    <label class="campo">Frente<select id="f-select"></select></label>
    <div class="linha"><button class="fantasma" value="" type="submit">Cancelar</button><button class="primario" value="ok" type="submit">Confirmar</button></div>
  </form>
</dialog>
<div id="toasts" aria-live="polite"></div>
<script>
"use strict";
(() => {
const $ = (s, r = document) => r.querySelector(s);
const PROP = new Set(["value"]);
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (PROP.has(k)) e[k] = v;
    else e.setAttribute(k, v === true ? "" : String(v));
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k); // strings viram texto: nunca HTML
  return e;
}

const ESTADOS = ["ativo", "parado", "concluído"];
const ROT_ESTADO = { "ativo": "Ativo", "parado": "Parado", "concluído": "Concluído" };
const SECOES = ["Ideias soltas", "Fatos e decisões", "Perguntas em aberto", "Prazos"];
const ROT_FRENTE = { governanca: "Governança", produto: "Produto", operacao: "Operação", pessoas: "Pessoas", acionista: "Acionista" };
const TRABALHO = new Set(["ness", "ionic", "bekaa", "trabalho"]);
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const S = { dados: null, busca: "", concluidos: false, arr: null, ph: null, aberto: null, reabrir: null };
try { S.concluidos = localStorage.getItem("painel.concluidos") === "1"; } catch (e) { /* sem storage */ }

const rotFrente = f => ROT_FRENTE[f] || f;
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const plural = (n, um, varios) => n === 1 ? um : varios;

// ---------- API ----------
function msgErro(st, j) {
  const e = j && j.erro;
  if (e === "proibido") return "Acesso negado.";
  if (e === "origem") return "Pedido recusado pelo servidor (origem).";
  if (e) return st === 502 ? "Não gravado: " + e : cap(String(e));
  return "Erro " + st + " no servidor.";
}
async function api(url, corpo) {
  const op = { credentials: "same-origin", cache: "no-store", headers: { "Accept": "application/json" } };
  if (corpo !== undefined) {
    op.method = "POST";
    op.headers["Content-Type"] = "application/json";
    op.body = JSON.stringify(corpo);
  }
  let r;
  try { r = await fetch(url, op); } catch (e) { throw new Error("Sem conexão com o servidor."); }
  let j = null;
  try { j = await r.json(); } catch (e) { /* corpo não JSON */ }
  if (!r.ok) throw new Error(msgErro(r.status, j));
  if (!j) throw new Error("Resposta inválida do servidor.");
  return j;
}

// ---------- toast ----------
function toast(msg, tipo) {
  const t = el("div", { class: "toast" + (tipo ? " " + tipo : ""), role: tipo === "erro" ? "alert" : "status" }, msg);
  $("#toasts").append(t);
  setTimeout(() => { t.classList.add("saindo"); setTimeout(() => t.remove(), 300); }, tipo === "erro" ? 6000 : 2800);
}

// ---------- datas ----------
function data(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || "").trim());
  if (!m) return null;
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return d.getUTCMonth() === +m[2] - 1 && d.getUTCDate() === +m[3] ? d : null;
}
const dias = (a, b) => Math.round((b - a) / 864e5);
function fmtData(d) {
  const hoje = data(S.dados && S.dados.hoje);
  let s = d.getUTCDate() + " " + MESES[d.getUTCMonth()];
  if (!hoje || d.getUTCFullYear() !== hoje.getUTCFullYear()) s += " " + d.getUTCFullYear();
  return s;
}
function prazoChip(prazo) {
  if (!prazo) return null;
  const d = data(prazo), hoje = data(S.dados.hoje);
  if (!d) return el("span", { class: "chip prazo invalido", title: "Prazo inválido: " + prazo }, "Prazo inválido");
  const n = hoje ? dias(hoje, d) : 99;
  let cls = "", dica;
  if (n < 0) { cls = " vencido"; dica = `Vencido há ${-n} ${plural(-n, "dia", "dias")}`; }
  else if (n === 0) { cls = " perto"; dica = "Vence hoje"; }
  else if (n <= 7) { cls = " perto"; dica = `Vence em ${n} ${plural(n, "dia", "dias")}`; }
  else dica = `Vence em ${n} dias`;
  return el("span", { class: "chip prazo" + cls, title: dica }, el("span", { class: "so-leitor" }, "Prazo: "), fmtData(d), el("span", { class: "so-leitor" }, ". " + dica));
}

// ---------- cartões ----------
function etiquetas(c) {
  const l = [];
  if (c.estado && c.estado !== "ativo") l.push([c.estado === "parado" ? "estado-parado" : c.estado === "concluído" ? "estado-concluido" : "", ROT_ESTADO[c.estado] || c.estado]);
  if (c.marca) l.push(["marca", c.marca]);
  if (c.frente) l.push(["frente", rotFrente(c.frente)]);
  if (c.holding) l.push(["holding", cap(c.holding)]);
  if (c.cliente) l.push(["cliente", c.cliente]);
  return l.length ? el("div", { class: "etiquetas" }, l.map(([k, t]) => el("span", { class: "etq " + k, title: t }, t))) : null;
}
function cartaoEl(c, col) {
  const e = el("article", {
    class: "cartao" + (c.estado === "concluído" ? " concluido" : ""), tabindex: 0, draggable: "true",
    role: "button", "aria-haspopup": "dialog", "data-caminho": c.caminho,
  });
  const rod = [prazoChip(c.prazo), c.parado_dias > 30 ? el("span", { class: "chip parado-ha" }, `Parado há ${c.parado_dias} dias`) : null].filter(Boolean);
  e.append(...[etiquetas(c), el("h3", { class: "titulo" }, c.tema || c.caminho),
    c.proximo_passo ? el("p", { class: "passo", title: c.proximo_passo }, c.proximo_passo) : null,
    rod.length ? el("div", { class: "rodape" }, rod) : null].filter(Boolean));
  e.addEventListener("click", () => abrir(c.caminho));
  e.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); abrir(c.caminho); } });
  e.addEventListener("dragstart", ev => iniciarArraste(ev, e, c, col));
  e.addEventListener("dragend", fimArraste);
  return e;
}
function visivel(c) {
  if (!S.concluidos && c.estado === "concluído") return false;
  if (!S.busca) return true;
  return norm([c.tema, c.proximo_passo, c.cliente, c.marca, c.frente, rotFrente(c.frente), c.holding, c.estado, c.caminho].join(" ")).includes(S.busca);
}
function colunaEl(col) {
  const vis = col.cartoes.filter(visivel);
  const lista = el("section", { class: "lista", "data-coluna": col.id, "aria-label": col.rotulo });
  const cont = el("div", { class: "cartoes" }, vis.map(c => cartaoEl(c, col)));
  if (!vis.length) cont.append(el("p", { class: "vazio" }, S.busca ? "Nada encontrado." : "Sem cartões."));
  const pe = el("div", { class: "pe" });
  pe.append(botaoAdicionar(col, pe));
  lista.append(el("header", { class: "cab" }, el("h2", { title: col.rotulo }, col.rotulo),
    el("span", { class: "conta", title: vis.length + " " + plural(vis.length, "cartão", "cartões") }, String(vis.length))), cont, pe);
  lista.addEventListener("dragover", ev => sobre(ev, lista));
  lista.addEventListener("drop", ev => soltar(ev, col));
  return lista;
}
function render() {
  const q = $("#quadro");
  if (!S.dados) return;
  const x = q.scrollLeft, ys = {};
  q.querySelectorAll(".lista").forEach(l => { ys[l.dataset.coluna] = l.querySelector(".cartoes").scrollTop; });
  q.replaceChildren(...S.dados.colunas.map(colunaEl));
  q.scrollLeft = x;
  q.querySelectorAll(".lista").forEach(l => { if (ys[l.dataset.coluna]) l.querySelector(".cartoes").scrollTop = ys[l.dataset.coluna]; });
  const ent = $("#entrada"), n = S.dados.entrada || 0;
  ent.textContent = "Entrada: " + n;
  ent.classList.toggle("tem", n > 0);
  if (S.reabrir) {
    const l = q.querySelector(`.lista[data-coluna="${CSS.escape(S.reabrir)}"]`);
    const col = S.dados.colunas.find(c => c.id === S.reabrir);
    S.reabrir = null;
    if (l && col) abrirComposer(col, l.querySelector(".pe"));
  }
}
async function carregar() {
  const b = $("#recarregar");
  b.disabled = true;
  try {
    S.dados = await api("/api/quadro");
    if (!S.arr) render();
  } catch (e) {
    toast(e.message, "erro");
    if (!S.dados) $("#quadro").replaceChildren(el("p", { class: "carregando" }, "Não deu para carregar o quadro. " + e.message));
  } finally { b.disabled = false; }
}
function achar(caminho) {
  for (const col of (S.dados ? S.dados.colunas : [])) {
    const c = col.cartoes.find(k => k.caminho === caminho);
    if (c) return { c, col };
  }
  return null;
}

// ---------- arrastar e soltar ----------
function iniciarArraste(ev, e, c, col) {
  S.arr = { c, col, e };
  ev.dataTransfer.effectAllowed = "move";
  ev.dataTransfer.setData("text/plain", c.tema || c.caminho);
  S.ph = el("div", { class: "placeholder", "aria-hidden": "true" });
  S.ph.style.height = e.offsetHeight + "px";
  requestAnimationFrame(() => { if (S.arr && S.arr.e === e) { e.after(S.ph); e.classList.add("arrastando"); } });
}
function sobre(ev, lista) {
  if (!S.arr) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = "move";
  const cont = lista.querySelector(".cartoes");
  const antes = [...cont.querySelectorAll(".cartao:not(.arrastando)")].find(k => {
    const r = k.getBoundingClientRect();
    return ev.clientY < r.top + r.height / 2;
  });
  if (antes) { if (S.ph.nextElementSibling !== antes) cont.insertBefore(S.ph, antes); }
  else if (cont.lastElementChild !== S.ph) cont.append(S.ph);
  document.querySelectorAll(".lista.alvo").forEach(l => { if (l !== lista) l.classList.remove("alvo"); });
  lista.classList.add("alvo");
}
function fimArraste() {
  document.querySelectorAll(".lista.alvo").forEach(l => l.classList.remove("alvo"));
  if (S.ph) { S.ph.remove(); S.ph = null; }
  if (S.arr) { S.arr.e.classList.remove("arrastando"); S.arr = null; }
}
async function soltar(ev, col) {
  if (!S.arr) return;
  ev.preventDefault();
  const { c, col: de, e } = S.arr;
  if (col.id === de.id || !S.ph) { fimArraste(); return; }
  S.ph.replaceWith(e);
  S.ph = null; S.arr = null;
  e.classList.remove("arrastando");
  e.classList.add("enviando");
  document.querySelectorAll(".lista.alvo").forEach(l => l.classList.remove("alvo"));
  await mover(c, col, null, () => { e.classList.remove("enviando"); render(); });
}
async function mover(c, col, frente, cancelado) {
  const corpo = { caminho: c.caminho, coluna: col.id };
  if (col.id === "ionic") {
    if (!frente) frente = await escolherFrente(c.tema);
    if (!frente) { if (cancelado) cancelado(); return null; }
    corpo.frente = frente;
  }
  let r = null;
  try {
    r = await api("/api/mover", corpo);
    toast(r.mudou ? `“${c.tema}” foi para ${col.rotulo}.` + (r.aviso ? ` Atenção: ${r.aviso}.` : "") : "Nada mudou.");
  } catch (e) { toast(e.message, "erro"); }
  await carregar();
  return r;
}
function selectFrente(id) {
  return el("select", { id },
    el("option", { value: "", disabled: true, selected: true }, "Escolha a frente…"),
    (S.dados.frentes || []).map(f => el("option", { value: f }, rotFrente(f))));
}
function escolherFrente(tema) {
  const dlg = $("#dlg-frente");
  const sel = selectFrente("f-select");
  $("#f-select").replaceWith(sel);
  $("#f-texto").textContent = `Em qual frente da IONIC fica “${tema}”?`;
  dlg.returnValue = "";
  return new Promise(res => {
    const fim = () => { dlg.removeEventListener("close", fim); res(dlg.returnValue === "ok" && sel.value ? sel.value : null); };
    dlg.addEventListener("close", fim);
    const ok = dlg.querySelector('button[value="ok"]');
    ok.disabled = true;
    sel.addEventListener("change", () => { ok.disabled = !sel.value; });
    dlg.showModal();
    sel.focus();
  });
}

// ---------- novo cartão ----------
function botaoAdicionar(col, pe) {
  return el("button", { class: "add", type: "button", onclick: () => abrirComposer(col, pe) }, "+ Adicionar cartão");
}
function abrirComposer(col, pe) {
  document.querySelectorAll(".composer").forEach(f => f._fechar && f._fechar());
  const ta = el("textarea", { rows: 2, maxlength: 300, placeholder: "Título do tema…", "aria-label": "Título do novo cartão em " + col.rotulo });
  const fr = col.id === "ionic" ? selectFrente("") : null;
  const ok = el("button", { class: "primario", type: "submit" }, "Adicionar cartão");
  const f = el("form", { class: "composer" }, ta, fr ? el("label", { class: "campo" }, "Frente", fr) : null,
    el("div", { class: "linha" }, ok, el("button", { class: "fantasma", type: "button", onclick: () => fechar() }, "Cancelar")));
  const fechar = () => { if (f.isConnected) pe.replaceChildren(botaoAdicionar(col, pe)); };
  f._fechar = fechar;
  async function criar() {
    const tema = ta.value.replace(/\s+/g, " ").trim();
    if (!tema) { ta.focus(); return; }
    if (fr && !fr.value) { toast("Escolha a frente da IONIC.", "erro"); fr.focus(); return; }
    const corpo = { coluna: col.id, tema };
    if (fr) corpo.frente = fr.value;
    ok.disabled = ta.disabled = true;
    try {
      await api("/api/criar", corpo);
      toast(`Cartão “${tema}” criado.`);
      S.reabrir = col.id;
    } catch (e) {
      toast(e.message, "erro");
      ok.disabled = ta.disabled = false;
      ta.focus();
      return;
    }
    await carregar();
  }
  f.addEventListener("submit", ev => { ev.preventDefault(); criar(); });
  ta.addEventListener("keydown", ev => {
    if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); criar(); }
    else if (ev.key === "Escape") { ev.preventDefault(); fechar(); }
  });
  pe.replaceChildren(f);
  ta.focus();
  f.scrollIntoView({ block: "nearest" });
}

// ---------- markdown simples (monta DOM; nada vira HTML) ----------
function inline(alvo, s) {
  for (const x of s.split(/(\*\*[^*]+\*\*|__[^_]+__|`[^`]+`)/)) {
    if (!x) continue;
    if (/^(\*\*|__).+\1$/.test(x)) alvo.append(el("strong", null, x.slice(2, -2)));
    else if (/^`.+`$/.test(x)) alvo.append(el("code", null, x.slice(1, -1)));
    else alvo.append(x);
  }
  return alvo;
}
function markdown(txt, tema) {
  const frag = document.createDocumentFragment();
  let linhas = String(txt || "").replace(/\r\n?/g, "\n").split("\n");
  if (linhas[0] === "---") { const f = linhas.indexOf("---", 1); if (f > 0) linhas = linhas.slice(f + 1); }
  let ul = null, p = null, code = null, primeiro = true, m;
  for (const l of linhas) {
    if (/^\s*```/.test(l)) {
      if (code) code = null;
      else { code = el("code"); frag.append(el("pre", null, code)); ul = p = null; }
      continue;
    }
    if (code) { code.append(l + "\n"); continue; }
    if (/^\s*<!--.*-->\s*$/.test(l)) continue;
    if ((m = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(l))) {
      ul = p = null;
      if (primeiro && m[1].length === 1 && norm(m[2]) === norm(tema)) { primeiro = false; continue; }
      frag.append(inline(el("h" + Math.min(6, m[1].length + 2)), m[2]));
      primeiro = false;
      continue;
    }
    if (!l.trim()) { ul = p = null; continue; }
    primeiro = false;
    if ((m = /^\s*[-*+]\s+(.*)$/.exec(l))) {
      p = null;
      if (!ul) { ul = el("ul"); frag.append(ul); }
      ul.append(inline(el("li"), m[1]));
      continue;
    }
    if (ul && /^\s{2,}\S/.test(l) && ul.lastChild) { ul.lastChild.append(" "); inline(ul.lastChild, l.trim()); continue; }
    ul = null;
    if (!p) { p = el("p"); frag.append(p); } else p.append(el("br"));
    inline(p, l.trim());
  }
  if (!frag.childNodes.length) frag.append(el("p", { class: "nada" }, "Sem texto."));
  return frag;
}

// ---------- detalhe do cartão ----------
const dlg = $("#dlg-cartao");
function abrir(caminho) {
  const a = achar(caminho);
  if (!a) return;
  S.aberto = caminho;
  montarModal(a.c, a.col);
  if (!dlg.open) dlg.showModal();
  $("#m-fechar").focus();
  carregarTexto(caminho, a.c.tema);
}
async function carregarTexto(caminho, tema) {
  const md = $("#m-md");
  try {
    const r = await api("/api/tema?caminho=" + encodeURIComponent(caminho));
    if (S.aberto === caminho && md.isConnected) md.replaceChildren(markdown(r.texto, tema));
  } catch (e) {
    if (md.isConnected) md.replaceChildren(el("p", { class: "nada" }, "Não deu para ler o texto. " + e.message));
  }
}
function opcoes(lista, atual) {
  return lista.map(([v, t]) => el("option", { value: v, selected: v === atual }, t));
}
function montarModal(c, col) {
  const foco = document.activeElement && dlg.contains(document.activeElement) ? document.activeElement.id : "";
  const ehTrab = TRABALHO.has(col.id);
  const dPrazo = data(c.prazo);

  // campos
  const est = el("select", { id: "m-estado" }, opcoes(ESTADOS.concat(ESTADOS.includes(c.estado) ? [] : [c.estado]).map(v => [v, ROT_ESTADO[v] || v]), c.estado));
  const passo = el("input", { id: "m-passo", type: "text", maxlength: 300, value: c.proximo_passo || "", placeholder: "O que fazer agora?" });
  const prazo = el("input", { id: "m-prazo", type: "date", value: dPrazo ? c.prazo.trim() : "" });
  const cliente = ehTrab ? el("input", { id: "m-cliente", type: "text", maxlength: 300, value: c.cliente || "" }) : null;
  const marca = col.id === "ness" ? el("select", { id: "m-marca" },
    opcoes([["", "Sem marca"]].concat((S.dados.marcas || []).map(x => [x, x])).concat(c.marca && !(S.dados.marcas || []).includes(c.marca) ? [[c.marca, c.marca]] : []), c.marca || "")) : null;
  const inicial = new Map([[est, est.value], [passo, passo.value], [prazo, prazo.value]]);
  if (cliente) inicial.set(cliente, cliente.value);
  if (marca) inicial.set(marca, marca.value);
  const chave = { "m-estado": "estado", "m-passo": "proximo_passo", "m-prazo": "prazo", "m-cliente": "cliente", "m-marca": "marca" };
  const salvar = el("button", { id: "m-salvar", class: "primario", type: "submit" }, "Salvar");
  const fCampos = el("form", { "aria-label": "Campos" },
    el("label", { class: "campo" }, "Estado", est),
    el("label", { class: "campo" }, "Próximo passo", passo),
    el("label", { class: "campo" }, "Prazo", prazo, c.prazo && !dPrazo ? el("span", { class: "aviso" }, "Prazo atual inválido: " + c.prazo) : null),
    cliente ? el("label", { class: "campo" }, "Cliente", cliente) : null,
    marca ? el("label", { class: "campo" }, "Marca", marca) : null,
    salvar);
  fCampos.addEventListener("submit", ev => {
    ev.preventDefault();
    const corpo = { caminho: c.caminho };
    for (const [campo, v0] of inicial) {
      const v = campo.tagName === "INPUT" && campo.type === "text" ? campo.value.trim() : campo.value;
      if (v !== v0.trim()) corpo[chave[campo.id]] = v;
    }
    if (Object.keys(corpo).length === 1) { toast("Nada mudou."); return; }
    acao(salvar, "/api/campos", corpo, "Salvo.");
  });

  // anotar
  const sec = el("select", { id: "m-secao" }, opcoes(SECOES.map(s => [s, s]), SECOES[0]));
  const nota = el("input", { id: "m-nota", type: "text", maxlength: 300, placeholder: "Escreva a anotação…", required: true });
  const anotar = el("button", { id: "m-anotar", class: "primario", type: "submit" }, "Anotar");
  const fAnotar = el("form", { "aria-label": "Anotar" },
    el("label", { class: "campo" }, "Seção", sec), el("label", { class: "campo" }, "Texto", nota), anotar);
  fAnotar.addEventListener("submit", async ev => {
    ev.preventDefault();
    const texto = nota.value.trim();
    if (!texto) { nota.focus(); return; }
    if (await acao(anotar, "/api/anotar", { caminho: c.caminho, secao: sec.value, texto }, "Anotado.")) $("#m-nota").focus();
  });

  // mover
  const dest = el("select", { id: "m-coluna" }, opcoes(S.dados.colunas.map(k => [k.id, k.rotulo]), col.id));
  const fr = selectFrente("m-frente");
  const frRot = el("label", { class: "campo", hidden: true }, "Frente", fr);
  dest.addEventListener("change", () => { frRot.hidden = dest.value !== "ionic"; });
  const btMover = el("button", { id: "m-mover", class: "primario", type: "submit" }, "Mover");
  const fMover = el("form", { "aria-label": "Mover para" }, el("label", { class: "campo" }, "Coluna", dest), frRot, btMover);
  fMover.addEventListener("submit", async ev => {
    ev.preventDefault();
    const alvo = S.dados.colunas.find(k => k.id === dest.value);
    if (!alvo || alvo.id === col.id) { toast("Já está nessa coluna."); return; }
    if (alvo.id === "ionic" && !fr.value) { toast("Escolha a frente da IONIC.", "erro"); fr.focus(); return; }
    btMover.disabled = true;
    const r = await mover(c, alvo, fr.value || null);
    btMover.disabled = false;
    if (r && dlg.open) reabrirModal(r.caminho);
  });

  const cab = el("div", { class: "m-cab" },
    el("div", null, el("h2", { id: "m-titulo" }, c.tema || c.caminho),
      el("p", { class: "m-sub" }, "na lista ", el("b", null, col.rotulo), " · " + c.caminho),
      etiquetas(c)),
    el("button", { id: "m-fechar", class: "fantasma fechar", type: "button", onclick: () => dlg.close() }, "Fechar"));
  const corpo = el("div", { class: "m-corpo" },
    el("section", { class: "principal", "aria-labelledby": "m-sec-texto" },
      el("h3", { class: "sec", id: "m-sec-texto" }, "Texto"), el("div", { id: "m-md", class: "md" }, el("p", { class: "nada" }, "Carregando…"))),
    el("aside", { class: "lateral" },
      el("div", null, el("h3", { class: "sec" }, "Campos"), fCampos),
      el("div", null, el("h3", { class: "sec" }, "Anotar"), fAnotar),
      el("div", null, el("h3", { class: "sec" }, "Mover para…"), fMover)));
  dlg.replaceChildren(cab, corpo);
  if (foco && document.getElementById(foco)) document.getElementById(foco).focus();
}
async function acao(botao, url, corpo, ok) {
  botao.disabled = true;
  let r = null;
  try { r = await api(url, corpo); toast(ok); }
  catch (e) { toast(e.message, "erro"); }
  botao.disabled = false;
  await carregar();
  if (r && dlg.open) reabrirModal(r.caminho || corpo.caminho);
  return r;
}
function reabrirModal(caminho) {
  const a = achar(caminho);
  if (!a) { dlg.close(); return; }
  S.aberto = caminho;
  const y = dlg.scrollTop;
  montarModal(a.c, a.col);
  dlg.scrollTop = y;
  carregarTexto(caminho, a.c.tema);
}
dlg.addEventListener("close", () => {
  const cam = S.aberto;
  S.aberto = null;
  dlg.replaceChildren();
  const k = cam && document.querySelector(`.cartao[data-caminho="${CSS.escape(cam)}"]`);
  if (k) k.focus();
});
dlg.addEventListener("click", ev => { if (ev.target === dlg) dlg.close(); }); // clique no véu fecha

// ---------- topo ----------
const btConc = $("#concluidos");
function syncConc() {
  btConc.setAttribute("aria-pressed", String(S.concluidos));
  btConc.textContent = S.concluidos ? "Esconder concluídos" : "Mostrar concluídos";
}
btConc.addEventListener("click", () => {
  S.concluidos = !S.concluidos;
  try { localStorage.setItem("painel.concluidos", S.concluidos ? "1" : "0"); } catch (e) { /* ok */ }
  syncConc();
  render();
});
let tBusca = 0;
$("#busca").addEventListener("input", ev => {
  clearTimeout(tBusca);
  tBusca = setTimeout(() => { S.busca = norm(ev.target.value.trim()); render(); }, 120);
});
$("#busca").addEventListener("keydown", ev => { if (ev.key === "Escape" && ev.target.value) { ev.target.value = ""; S.busca = ""; render(); } });
$("#recarregar").addEventListener("click", async () => { await carregar(); toast("Quadro atualizado."); });
document.addEventListener("keydown", ev => {
  if (ev.key === "/" && !dlg.open && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { ev.preventDefault(); $("#busca").focus(); }
});
window.addEventListener("focus", () => { if (!dlg.open && !S.arr && !document.querySelector(".composer")) carregar(); });
syncConc();
carregar();
})();
</script>
